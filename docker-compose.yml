services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Disposable database, used only by the tests.
  db-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: nfes_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d nfes_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      target: build
    profiles: [test]
    command: npm test
    environment:
      DATABASE_URL: postgres://test:test@db-test:5432/nfes_test
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  db-data:
